<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxos · referência 001</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Storyboard: a sequência de ecrãs de um fluxo, com a ação e a transição entre cada par. */
  body { padding: var(--s48); }
  .cab { max-width: 1500px; }
  .fila { display: flex; flex-wrap: wrap; align-items: flex-start; row-gap: var(--s48); margin-top: var(--s32); }
  .passo { flex: none; display: flex; align-items: flex-start; }
  .quadro { display: flex; flex-direction: column; gap: var(--s8); }
  .quadro img, .quadro .email { border: var(--fino) solid var(--reguaForte); border-radius: var(--r-superficie); display: block; background: var(--folha); }
  .quadro.tel img { width: 220px; }
  .quadro.desk img { width: 400px; }
  .quadro .n { font-family: var(--mono); font-size: 13px; line-height: 18px; color: var(--tintaTenue); }
  .quadro .nome { font-size: 15px; line-height: 22px; font-weight: 600; max-width: 220px; }
  .quadro.desk .nome { max-width: 400px; }
  .quadro .nota { font-size: 13px; line-height: 18px; color: var(--tintaMedia); max-width: 220px; }
  .quadro.desk .nota { max-width: 400px; }
  .seta { width: 152px; padding: 120px var(--s12) 0; display: flex; flex-direction: column; gap: var(--s8); }
  .seta .acao-txt { font-size: 14px; line-height: 20px; font-weight: 600; }
  .seta .linha { height: 2px; background: var(--tinta); position: relative; }
  .seta .linha::after { content: ""; position: absolute; right: -2px; top: -5px; border-left: 10px solid var(--tinta); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .seta .trans { font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--tintaMedia); }
  /* Email simulado (não é um ecrã da app) */
  .email { width: 220px; padding: var(--s16); min-height: 300px; }
  .email .de { font-size: 13px; line-height: 18px; color: var(--tintaMedia); }
  .email .assunto { font-size: 15px; line-height: 22px; font-weight: 600; margin-top: var(--s8); }
  .email .txt { font-size: 13px; line-height: 18px; margin-top: var(--s8); }
  .email .bt { margin-top: var(--s16); background: var(--tinta); color: var(--sobreTinta); border-radius: var(--r-controlo); font-size: 13px; font-weight: 600; text-align: center; padding: var(--s8); }
  .ramo { margin-top: var(--s24); padding: var(--s16); border-left: 3px solid var(--cartolina); background: var(--folha); max-width: 1100px; font-size: 15px; line-height: 22px; }
</style>
</head>
<body>
<div class="cab">
  <p class="registo tenue">ProDossier · feature 001 · storyboard</p>
  <h1 class="titulo mt8" id="titulo"></h1>
  <p class="corpo media mt8" id="desc"></p>
</div>
<div class="fila" id="fila"></div>
<div id="ramos"></div>
<script>
// Transições (ver 03-design.md, "Transições entre ecrãs"):
const T = {
  pagina: 'página: cross-fade 200 ms (base), entra easeOutCubic, sai easeInCubic',
  estado: 'mesmo ecrã: cross-fade 200 ms (base / mudar)',
  dialogo: 'diálogo: opacidade + escala 0.98→1, 200 ms (base / entrar)',
  folhaInf: 'folha inferior: sobe 320 ms (lento / entrar)',
  folhaLat: 'folha lateral: desliza da direita 320 ms (lento / entrar)',
  fechar: 'fecha: 200 ms (base / sair); linha nova com realce a desvanecer 1600 ms',
  esqueleto: 'skeleton → dados: cross-fade 200 ms, sem saltos de layout',
  externo: 'fora da app (email); abre no navegador',
};
const email = (assunto, txt, bt) => ({ email: { assunto, txt, bt } });
const F = {
  1: {
    t: '1. Convite por link → consentimento → Com quem partilho → criar palavra-passe',
    d: 'Cliente novo, no telemóvel. A palavra-passe só é proposta depois de responder ao pedido, nunca antes.',
    passos: [
      [email('Ribeira Seguros pede acesso aos seus dados', 'Ana Martins, da Ribeira Seguros, pede-lhe acesso aos dados que guardar no ProDossier.', 'Ver o pedido'), 'Email do convite', 'Enviado pelo mediador.'],
      ['consentimento-a-carregar-telemovel', 'A validar o link', 'Skeleton com a forma do consentimento; a barra já está no sítio, desativada.', 'abre o link', T.externo],
      ['consentimento-telemovel', 'Pedido de acesso', 'Recusar e Aceitar com o mesmo peso.', 'dados chegam', T.esqueleto],
      ['consentimento-aceite-telemovel', 'Resposta registada', 'A barra dá lugar ao resultado; o foco vai para lá.', 'carrega Aceitar', T.estado],
      ['criar-palavra-passe-telemovel', 'Criar palavra-passe', 'Regras em tempo real enquanto escreve.', 'Ver com quem partilho', T.pagina],
      ['criar-palavra-passe-cumprida-telemovel', 'Regras cumpridas', 'Cada regra muda de ícone (vazio → visto).', 'escreve', 'ícone: 120 ms (rapido / mudar)'],
      ['palavra-passe-criada-telemovel', 'Com quem partilho', 'Confirmação no topo; a conta mostra "Criada a".', 'Guardar palavra-passe', T.pagina],
    ],
    ramos: ['"Agora não" no passo 5 → Com quem partilho sem aviso (com-quem-partilho-telemovel.png); o convite volta no máximo na entrada seguinte por link.',
            '"Recusar" no passo 3 → consentimento-recusado-telemovel.png; o resto do fluxo é igual.',
            'Falha ao registar → consentimento-erro-telemovel.png (aviso por cima dos botões, nada alterado). Sem ligação → consentimento-offline-telemovel.png.'],
  },
  2: {
    t: '2. Entrar com palavra-passe (e recuperar)',
    d: 'Cliente ou mediador, no desktop. Mesmo formulário para todos.',
    desk: true,
    passos: [
      ['entrar-desktop', 'Entrar', 'Email e palavra-passe; link como alternativa.'],
      ['entrar-erro-desktop', 'Credenciais erradas', 'Mensagem genérica + dica do link; foco no Email.', 'carrega Entrar', T.estado],
      ['recuperar-palavra-passe-desktop', 'Recuperar palavra-passe', 'Um campo.', 'Esqueci-me da palavra-passe', T.pagina],
      [email('Definir uma nova palavra-passe', 'Recebemos um pedido para definir uma nova palavra-passe na sua conta.', 'Definir palavra-passe'), 'Email de recuperação', 'Resposta igual exista ou não a conta.', 'Enviar link', T.externo],
      ['definir-palavra-passe-desktop', 'Definir palavra-passe', 'Mesmas regras em tempo real.', 'abre o link', T.externo],
      ['com-quem-partilho-desktop', 'Ecrã inicial do perfil', 'Cliente: Com quem partilho. Mediador: Clientes.', 'Guardar e entrar', T.pagina],
    ],
    ramos: ['Email incompleto ou palavra-passe vazia → entrar-validacao-desktop.png (erro por baixo de cada campo).',
            'Sem rede ao entrar → entrar-sem-rede-desktop.png; sem ligação → entrar-offline-desktop.png; sessão terminada → entrar-sessao-terminada-desktop.png.'],
  },
  3: {
    t: '3. Link expirado → novo link',
    d: 'O cliente nunca fica sem saída: pede outro link sem depender do mediador.',
    passos: [
      [email('Ribeira Seguros pede acesso aos seus dados', 'Email antigo, aberto dias depois.', 'Ver o pedido'), 'Link antigo', ''],
      ['link-expirado-telemovel', 'Este link já não é válido', 'Explica porquê; pede o email.', 'abre o link', T.externo],
      ['link-expirado-enviado-telemovel', 'Link enviado', '"Enviar outra vez" bloqueado 60 s com a razão escrita.', 'Enviar link novo', T.estado],
      [email('O seu link de acesso ao ProDossier', 'Use este link para entrar. Expira por segurança.', 'Entrar no ProDossier'), 'Email novo', '', 'espera o email', T.externo],
      ['com-quem-partilho-telemovel', 'Com quem partilho', 'O pedido original está no bloco "À espera da sua resposta".', 'abre o link novo', T.externo],
    ],
    ramos: ['"Já tem palavra-passe? Entrar com ela" no passo 2 → Entrar com o email preenchido (fluxo 2).'],
  },
  4: {
    t: '4. Mediador cria cliente → reenvia pedido',
    d: 'Desktop. A folha lateral mantém a lista visível por trás do véu.',
    desk: true,
    passos: [
      ['clientes-desktop', 'Clientes', 'Tabela de 4 colunas.'],
      ['criar-cliente-desktop', 'Criar cliente', 'Folha lateral de 440; foco no Nome.', 'Criar cliente', T.folhaLat],
      ['criar-cliente-validacao-desktop', 'Erros de campo', 'Erro por baixo de cada campo; a folha não fecha.', 'Criar e enviar pedido', T.estado],
      ['cliente-criado-desktop', 'Cliente criado', 'Linha nova no topo com realce; aviso por cima da tabela.', 'corrige e envia', T.fechar],
      ['pedido-reenviado-desktop', 'Pedido reenviado', 'Reenviar bloqueado até às 15:05, com a razão escrita.', 'Reenviar pedido', T.estado],
    ],
    ramos: ['Telemóvel: criar cliente abre em ecrã inteiro (criar-cliente-telemovel.png), com transição de página e não de folha.',
            'Sem ligação → clientes-offline-desktop.png; lista não carregou → clientes-erro-desktop.png; a carregar → clientes-a-carregar-desktop.png.'],
  },
  5: {
    t: '5. Retirar acesso',
    d: 'Cliente, no telemóvel. Sem anular: voltar a partilhar exige um pedido novo.',
    passos: [
      ['com-quem-partilho-telemovel', 'Com quem partilho', '"Retirar acesso" na linha do escritório.'],
      ['retirar-acesso-telemovel', 'Confirmar', 'Folha inferior; foco inicial em Cancelar.', 'Retirar acesso', T.folhaInf],
      ['acesso-retirado-telemovel', 'Acesso retirado', 'A linha passa para "Sem acesso" com realce; aviso no topo.', 'Retirar acesso', T.fechar],
    ],
    ramos: ['Falha ao retirar → retirar-acesso-erro-telemovel.png (aviso dentro da folha; a linha fica igual).',
            'Tablet e desktop: diálogo de 480 em vez da folha (retirar-acesso-desktop.png), com opacidade e escala.'],
  },
  6: {
    t: '6. Admin cria escritório e convida mediador',
    d: 'Desktop. O admin nunca vê nomes nem emails de clientes.',
    desk: true,
    passos: [
      ['admin-vazio-desktop', 'Plataforma vazia', 'Contagens a 0 e um só "Criar escritório".'],
      ['criar-escritorio-desktop', 'Criar escritório', 'Folha lateral.', 'Criar escritório', T.folhaLat],
      ['escritorio-criado-desktop', 'Escritório criado', 'Linha nova com realce; aviso "Convide agora o primeiro mediador."', 'Criar escritório', T.fechar],
      ['convidar-mediador-desktop', 'Convidar mediador', 'Escritório já preenchido.', 'Convidar mediador', T.folhaLat],
      ['definir-palavra-passe-desktop', 'Mediador define palavra-passe', 'Pelo email do convite; mesmas regras.', 'Enviar convite → email', T.externo],
      ['clientes-vazio-desktop', 'Mediador entra', 'Clientes, vazio, com "Criar cliente".', 'Guardar e entrar', T.pagina],
    ],
    ramos: ['Sem ligação → admin-offline-desktop.png; contagens não carregaram → admin-erro-desktop.png; a carregar → admin-a-carregar-desktop.png.'],
  },
};
const f = F[new URLSearchParams(location.search).get('fluxo') || '1'];
document.getElementById('titulo').textContent = f.t;
document.getElementById('desc').textContent = f.d;
const fila = document.getElementById('fila');
f.passos.forEach((p, i) => {
  const [img, nome, nota, acao, trans] = p;
  const passo = document.createElement('div'); passo.className = 'passo';
  if (i > 0) passo.innerHTML = `<div class="seta"><span class="acao-txt">${acao}</span><div class="linha"></div><span class="trans">${trans}</span></div>`;
  const tipo = f.desk && typeof img === 'string' ? 'desk' : 'tel';
  const vis = typeof img === 'string'
    ? `<img src="../${img}.png" alt="">`
    : `<div class="email"><p class="de">De: ProDossier</p><p class="assunto">${img.email.assunto}</p><p class="txt">${img.email.txt}</p><div class="bt">${img.email.bt}</div></div>`;
  passo.innerHTML += `<div class="quadro ${tipo}"><span class="n">${String(i + 1).padStart(2, '0')}</span>${vis}<span class="nome">${nome}</span><span class="nota">${nota}</span></div>`;
  fila.appendChild(passo);
});
document.getElementById('ramos').innerHTML = (f.ramos || []).map((r) => `<p class="ramo">${r}</p>`).join('');
</script>
</body>
</html>
