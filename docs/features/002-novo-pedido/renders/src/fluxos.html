<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxos · referência 002</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Storyboard: a sequência de ecrãs de um fluxo, com a ação e a transição entre cada par. */
  body { padding: var(--s48); }
  .cab { max-width: 1500px; }
  .fila { display: flex; flex-wrap: wrap; align-items: flex-start; row-gap: var(--s48); margin-top: var(--s32); }
  .passo { flex: none; display: flex; align-items: flex-start; }
  .quadro { display: flex; flex-direction: column; gap: var(--s8); }
  .quadro img, .quadro .email { border: var(--fino) solid var(--reguaForte); border-radius: var(--r-superficie); display: block; background: var(--folha); }
  .quadro.tel img { width: 220px; max-height: 476px; object-fit: cover; object-position: top; }
  .quadro.desk img { width: 400px; max-height: 250px; object-fit: cover; object-position: top; }
  .quadro .n { font-family: var(--mono); font-size: 13px; line-height: 18px; color: var(--tintaTenue); }
  .quadro .nome { font-size: 15px; line-height: 22px; font-weight: 600; max-width: 220px; }
  .quadro.desk .nome { max-width: 400px; }
  .quadro .nota { font-size: 13px; line-height: 18px; color: var(--tintaMedia); max-width: 220px; }
  .quadro.desk .nota { max-width: 400px; }
  .seta { width: 152px; padding: 120px var(--s12) 0; display: flex; flex-direction: column; gap: var(--s8); }
  .seta .acao-txt { font-size: 14px; line-height: 20px; font-weight: 600; }
  .seta .linha { height: 2px; background: var(--tinta); position: relative; }
  .seta .linha::after { content: ""; position: absolute; right: -2px; top: -5px; border-left: 10px solid var(--tinta); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .seta .trans { font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--tintaMedia); }
  /* Email simulado (não é um ecrã da app) */
  .email { width: 220px; padding: var(--s16); min-height: 300px; }
  .email .de { font-size: 13px; line-height: 18px; color: var(--tintaMedia); }
  .email .assunto { font-size: 15px; line-height: 22px; font-weight: 600; margin-top: var(--s8); }
  .email .txt { font-size: 13px; line-height: 18px; margin-top: var(--s8); }
  .email .bt { margin-top: var(--s16); background: var(--tinta); color: var(--sobreTinta); border-radius: var(--r-controlo); font-size: 13px; font-weight: 600; text-align: center; padding: var(--s8); }
  .ramo { margin-top: var(--s24); padding: var(--s16); border-left: 3px solid var(--cartolina); background: var(--folha); max-width: 1100px; font-size: 15px; line-height: 22px; }
</style>
</head>
<body>
<div class="cab">
  <p class="registo tenue">ProDossier · feature 002 · storyboard</p>
  <h1 class="titulo mt8" id="titulo"></h1>
  <p class="corpo media mt8" id="desc"></p>
</div>
<div class="fila" id="fila"></div>
<div id="ramos"></div>
<script>
// Transições (ver 03-design.md, "Transições entre ecrãs"):
const T = {
  pagina: 'página: cross-fade 200 ms (base), entra easeOutCubic, sai easeInCubic',
  estado: 'mesmo ecrã: cross-fade 200 ms (base / mudar)',
  dialogo: 'diálogo: opacidade + escala 0.98→1, 200 ms (base / entrar)',
  folhaInf: 'folha inferior: sobe 320 ms (lento / entrar)',
  folhaLat: 'folha lateral: desliza da direita 320 ms (lento / entrar)',
  fechar: 'fecha: 200 ms (base / sair); linha nova com realce a desvanecer 1600 ms',
  esqueleto: 'skeleton → dados: cross-fade 200 ms, sem saltos de layout',
  externo: 'fora da app (email); abre no navegador',
};
const email = (assunto, txt, bt) => ({ email: { assunto, txt, bt } });
const F = {
  1: {
    t: '1. Novo pedido → pedidos criados → ficha → pedido aberto',
    d: 'Mediadora, no desktop. Da lista de Clientes até ao pedido em só leitura; o cliente recebe o email e a notificação no passo 4.',
    desk: true,
    passos: [
      ['clientes-desktop', 'Clientes', 'Coluna Pedidos com o trilho de etapas; "Novo pedido" no topo e por cliente ativo.'],
      ['novo-pedido-escolher-cliente-desktop', 'Escolher o cliente', 'Só aparecem clientes com acesso ativo, e a lista diz porquê.', 'Novo pedido', T.pagina],
      ['novo-pedido-desktop', 'Tipos, lista e mensagem', 'À direita, a folha que o cliente vai receber, editável só neste pedido.', 'escolhe o cliente e os tipos', 'bloco do tipo entra 200 ms (base / entrar)'],
      ['novo-pedido-a-criar-desktop', 'A criar', 'Spinner só no botão; a escolha fica visível e inerte.', 'Criar 2 pedidos', 'texto → spinner 120 ms (rapido / mudar)'],
      ['ficha-pedidos-criados-desktop', 'Ficha com os pedidos novos', 'Aviso "2 pedidos criados" e as linhas novas com realce.', 'servidor confirma os 2', T.pagina + '; realce 1600 ms'],
      ['pedido-mediador-desktop', 'Pedido aberto (só leitura)', 'Lista guardada, mensagem, quem criou e as 4 etapas.', 'abre "Automóvel"', T.pagina],
    ],
    ramos: ['Vindo da ficha (botão "Novo pedido" da ficha ou da linha), o passo 2 não existe: o cliente já vem escolhido (novo-pedido-desktop.png).',
            'Pedido repetido, falhas e email por enviar estão no fluxo 3.'],
  },
  2: {
    t: '2. Email ou notificação → Os meus pedidos → pedido',
    d: 'Cliente, no telemóvel. O email só diz o que foi pedido; a lista vê-se na app.',
    passos: [
      ['email-pedido-telemovel', 'Email do pedido', 'Escritório, tipos, mensagem e "Ver os pedidos". Sem lista nem dados.'],
      ['meus-pedidos-telemovel', 'Os meus pedidos', 'O sino mostra 2 por ler; cada pedido com o trilho de etapas.', 'Ver os pedidos (entra se precisar)', T.externo],
      ['notificacoes-telemovel', 'Notificações', 'Ecrã inteiro no telemóvel; painel lateral no tablet e no desktop.', 'carrega no sino', T.pagina],
      ['pedido-cliente-telemovel', 'O pedido', 'Fica lida só quando o servidor confirma; o contador desce.', 'abre "Novo pedido: Automóvel"', T.pagina + '; contador 200 ms (base / mudar)'],
    ],
    ramos: ['Notificação de um escritório a quem retirou o acesso → pedido-cliente-acesso-retirado-telemovel.png (abre na mesma, sem ações).',
            'Tablet e desktop: o painel de notificações é uma folha lateral de 440 (notificacoes-desktop.png), lento / entrar.',
            'Cliente que nunca entrou: só recebe o email (sem notificação); o primeiro acesso mostra o painel sem notificações antigas.'],
  },
  3: {
    t: '3. Exceções do Novo pedido',
    d: 'Mediadora, no desktop. Nada aparece como criado sem confirmação do servidor; a escolha nunca se perde.',
    desk: true,
    passos: [
      ['novo-pedido-repetido-desktop', 'Pedido repetido', 'Aviso por baixo do tipo; sem confirmar, esse tipo fica de fora e a barra diz "Criar 1 pedido".'],
      ['novo-pedido-erro-desktop', 'Falha ao criar', 'Nada foi criado; a escolha mantém-se e o botão volta a "Criar".', 'Criar → falha', T.estado],
      ['ficha-email-falhou-desktop', 'Criado, email por enviar', 'Os pedidos existem; "Reenviar email" no aviso.', 'Criar → pedidos criados, email falha', T.pagina],
      ['ficha-email-reenviado-desktop', 'Email reenviado', 'Bloqueado 60 s com a hora escrita.', 'Reenviar email', T.estado],
    ],
    ramos: ['Concessão deixou de estar ativa entre abrir e criar → novo-pedido-sem-concessao-desktop.png.',
            'Lista de um tipo vazia → novo-pedido-lista-vazia-desktop.png; sem ligação → novo-pedido-offline-desktop.png; catálogo não carregou → novo-pedido-erro-catalogo-desktop.png.',
            'Cliente pendente, recusado ou retirado (link antigo ou endereço direto) → novo-pedido-sem-acesso-*.png.'],
  },
};
const f = F[new URLSearchParams(location.search).get('fluxo') || '1'];
document.getElementById('titulo').textContent = f.t;
document.getElementById('desc').textContent = f.d;
const fila = document.getElementById('fila');
f.passos.forEach((p, i) => {
  const [img, nome, nota, acao, trans] = p;
  const passo = document.createElement('div'); passo.className = 'passo';
  if (i > 0) passo.innerHTML = `<div class="seta"><span class="acao-txt">${acao}</span><div class="linha"></div><span class="trans">${trans}</span></div>`;
  const tipo = f.desk && typeof img === 'string' ? 'desk' : 'tel';
  const vis = typeof img === 'string'
    ? `<img src="../${img}.png" alt="">`
    : `<div class="email"><p class="de">De: ProDossier</p><p class="assunto">${img.email.assunto}</p><p class="txt">${img.email.txt}</p><div class="bt">${img.email.bt}</div></div>`;
  passo.innerHTML += `<div class="quadro ${tipo}"><span class="n">${String(i + 1).padStart(2, '0')}</span>${vis}<span class="nome">${nome}</span><span class="nota">${nota}</span></div>`;
  fila.appendChild(passo);
});
document.getElementById('ramos').innerHTML = (f.ramos || []).map((r) => `<p class="ramo">${r}</p>`).join('');
</script>
</body>
</html>
